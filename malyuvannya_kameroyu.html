<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Малювання камерою</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial}video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#bar{position:fixed;top:10px;left:10px;right:10px;z-index:5;display:flex;gap:8px;align-items:center}button{font-size:16px;padding:9px 12px;border:0;border-radius:10px}#status{color:white;background:#0009;padding:8px;border-radius:10px}</style></head><body><video id="cam" autoplay playsinline></video><canvas id="draw"></canvas><div id="bar"><button id="start">📷 Увімкнути камеру</button><button id="clear">Очистити</button><span id="status">Камера вимкнена</span></div><script>const v=document.getElementById('cam'),c=document.getElementById('draw'),x=c.getContext('2d');function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);x.lineWidth=5;x.lineCap='round';x.strokeStyle='red'}addEventListener('resize',size);size();let down=false;c.addEventListener('pointerdown',e=>{down=true;x.beginPath();x.moveTo(e.clientX,e.clientY)});c.addEventListener('pointermove',e=>{if(!down)return;x.lineTo(e.clientX,e.clientY);x.stroke()});addEventListener('pointerup',()=>down=false);document.getElementById('clear').onclick=()=>x.clearRect(0,0,innerWidth,innerHeight);document.getElementById('start').onclick=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});v.srcObject=s;document.getElementById('status').textContent='Камера працює ✅'}catch(e){document.getElementById('status').textContent='Немає доступу до камери ❌';alert('Дозволь Chrome доступ до камери. Сторінка має бути відкрита через HTTPS.')}};</script></body></html>
